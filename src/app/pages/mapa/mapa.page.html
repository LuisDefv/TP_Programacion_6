<ion-content [fullscreen]="true" class="map-content">
  <div id="map"></div>

  <div class="map-status" *ngIf="status$ | async as status">
    <span
      class="dot"
      [class.dot--error]="status.error"
      [class.dot--cached]="status.cached"
    ></span>
    <span>{{ (flights$ | async)?.length ?? 0 }} vuelos</span>
    <ion-spinner *ngIf="status.loading" name="crescent" class="status-spinner"></ion-spinner>
    <span *ngIf="status.updatedAt">· {{ status.updatedAt | date: 'HH:mm:ss' }}</span>
    <span *ngIf="status.cached">· sin conexión</span>
  </div>

  <div class="map-empty" *ngIf="!(flights$ | async)?.length && !(status$ | async)?.error">
    Sin vuelos en esta zona. Mové el mapa.
  </div>

  <div class="map-error" *ngIf="(status$ | async)?.error">
    <ion-icon name="cloud-offline-outline"></ion-icon>
    <span>{{ (status$ | async)?.error }} Reintentando…</span>
  </div>

  <div class="map-legend" slot="fixed">
    <span><i class="swatch swatch--ground"></i>&lt;1.000 ft</span>
    <span><i class="swatch swatch--low"></i>&lt;10.000</span>
    <span><i class="swatch swatch--mid"></i>&lt;25.000</span>
    <span><i class="swatch swatch--high"></i>+25.000</span>
  </div>

  <ion-fab slot="fixed" vertical="bottom" horizontal="end">
    <ion-fab-button size="small" (click)="refresh(true)" [disabled]="refreshing">
      <ion-icon name="refresh"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
